[project]
name = "obs2pdf"
dynamic = ["version"]
description = "Turn Obsidian notes into typeset PDFs (notes, minutes, reports, letters, cheatsheets, handouts) via Pandoc and Typst."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["obsidian", "markdown", "typst", "pdf", "pandoc", "catppuccin"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Text Processing :: Markup :: Markdown",
]
dependencies = [
    "argcomplete>=3.5",
    "pypandoc>=1.13",
    "pyyaml>=6.0",
    "tomli>=2.0; python_version < '3.11'",
]

[project.urls]
Homepage = "https://github.com/p-e-n-t-h-a/obs2pdf"
Source = "https://github.com/p-e-n-t-h-a/obs2pdf"
Issues = "https://github.com/p-e-n-t-h-a/obs2pdf/issues"

[project.scripts]
obs2pdf = "obs2pdf.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/obs2pdf/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/obs2pdf"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/examples/*.md",
    "/examples/Makefile",
    "/install.sh",
    "/uninstall.sh",
    "/CHANGELOG.md",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.14",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
